<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보드게임 연구회</title>
<script>try{var _t=localStorage.getItem('bgclub-theme2');if(_t==='clay')_t='liquid';document.documentElement.dataset.theme=_t||'liquid'}catch(e){document.documentElement.dataset.theme='liquid'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DotGothic16&family=Jua&family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d1c; --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13); --line:rgba(255,255,255,.14);
  --text:#f4f5fb; --sub:rgba(232,236,255,.64); --dim:rgba(232,236,255,.38);
  --a1:#8f7bff; --a2:#45d6c4; --fine:#ff7d93; --gold:#ffc861; --r:22px;
  --soft:rgba(255,255,255,.07); --soft2:rgba(255,255,255,.13); --panel:rgba(24,26,48,.86); --scrim:rgba(4,6,14,.55); --pinkt:#ffb3c0; --tealt:#8ef0e2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;letter-spacing:-.01em}
body{min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px)}
.b1{width:360px;height:360px;background:#6a4cff;top:-110px;left:-100px;opacity:.6}
.b2{width:300px;height:300px;background:#18b3a2;top:38%;right:-140px;opacity:.42}
.b3{width:340px;height:340px;background:#ff5e8a;bottom:-140px;left:-80px;opacity:.32}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 120px)}
header.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 18px}
.brand small{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-bottom:2px}
.brand h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.22),inset 0 1px 0 var(--soft);margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card h3 .more{font-size:12px;color:var(--sub);font-weight:500}
.muted{color:var(--sub)} .dim{color:var(--dim)}
.banner{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--sub);padding:12px 14px;border-radius:16px;background:rgba(255,200,97,.09);border:1px solid rgba(255,200,97,.25);margin-bottom:14px}
.banner b{color:var(--gold);font-weight:700}
.hero{position:relative;overflow:hidden;padding:22px 20px}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(143,123,255,.45),transparent 70%)}
.hero .label{font-size:13px;color:var(--sub);font-weight:500}
.hero .big{font-size:42px;font-weight:900;letter-spacing:-.04em;margin:4px 0 16px;background:linear-gradient(120deg,#fff 20%,#c9c0ff 60%,var(--tealt));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .big span{font-size:22px;font-weight:700}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--soft);border:1px solid var(--soft);border-radius:14px;padding:10px 12px}
.mini small{display:block;font-size:11px;color:var(--sub)}
.mini b{font-size:16px;font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.duo .card{margin:0;padding:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:rgba(255,125,147,.15);color:var(--pinkt);margin-bottom:10px}
.tag.teal{background:rgba(69,214,196,.14);color:var(--tealt)}
.duo .who{font-size:23px;font-weight:900;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{display:flex;align-items:center;gap:12px;padding:9px 0}
.rank+.rank{border-top:1px solid var(--soft)}
.rank .no{width:18px;font-size:13px;font-weight:700;color:var(--dim);text-align:center}
.rank .no.top{color:var(--gold)}
.rank .mid{flex:1;min-width:0}
.rank .nm{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:6px}
.rank .nm span:last-child{font-weight:700}
.rank .sub{font-size:11px;color:var(--dim);margin-top:5px}
.bar{height:7px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--a2))}
.bar.pink>i{background:linear-gradient(90deg,#ff7d93,#ffb26b)}
.av{--h:250;flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;background:linear-gradient(135deg,hsl(var(--h) 75% 62%),hsl(calc(var(--h) + 40) 70% 46%));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.av.sm{width:26px;height:26px;border-radius:9px;font-size:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.split .card{margin:0;padding:14px 12px}
.split h3{font-size:14px;margin-bottom:6px}
.cr{padding:8px 0}
.cr+.cr{border-top:1px solid var(--soft)}
.cr .top{display:flex;align-items:center;gap:6px}
.cr .no{width:13px;flex:none;font-size:11px;font-weight:700;color:var(--dim);text-align:center}
.cr .no.gold{color:var(--gold)}
.cr .nm{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .amt{font-size:13px;font-weight:700;margin:4px 0 5px 19px;white-space:nowrap}
.cr .amt small{font-weight:400;color:var(--dim);font-size:11px}
.cr .bar{height:5px;margin-left:19px}
.thumb{flex:none;width:26px;height:26px;border-radius:9px;font-size:14px}
.months{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.months .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.months .pill{width:100%;max-width:34px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--a1),rgba(143,123,255,.25));min-height:4px}
.months .col.now .pill{background:linear-gradient(180deg,var(--a2),rgba(69,214,196,.25))}
.months small{font-size:11px;color:var(--sub)}
.months em{font-style:normal;font-size:10px;color:var(--dim)}
.rec{display:flex;gap:12px;align-items:center;padding:11px 0}
.rec+.rec{border-top:1px solid var(--soft)}
.rec .gi{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;overflow:hidden}
.rec .mid{flex:1;min-width:0}
.rec .t{font-size:14px;font-weight:700}
.rec .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .amt{font-weight:700;color:var(--pinkt);font-size:14px;white-space:nowrap}
.rec .del{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:15px;font-weight:700;font-size:15px;background:var(--glass2);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--a1),#6c8dff);border:0;box-shadow:0 8px 22px rgba(120,110,255,.38)}
.btn.danger{background:rgba(255,125,147,.16);border-color:rgba(255,125,147,.35);color:var(--pinkt)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;box-shadow:none}
.btn{white-space:nowrap;flex-shrink:0}
.btn.sm{height:36px;font-size:13px;border-radius:12px;padding:0 12px}
.step{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step .n{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--soft2)}
.step.done .n{background:linear-gradient(135deg,var(--a1),var(--a2))}
.step b{font-size:15px}
.step .r{margin-left:auto;font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:500;font-size:14px;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,rgba(143,123,255,.9),rgba(108,141,255,.9));border-color:transparent;box-shadow:0 6px 18px rgba(143,123,255,.35)}
.chip.fine.on{background:linear-gradient(135deg,#ff7d93,#ff9f6e);box-shadow:0 6px 18px rgba(255,125,147,.35)}
.chip.plain{padding:8px 14px}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.daterow .date{font-size:14px;padding:7px 9px;min-width:0}
.date{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color-scheme:dark}
.ggrid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px}
.ggrid.flat{gap:8px}
.chips.center{justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;height:40px;padding:0 6px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:500;transition:transform .12s}
.pc:active{transform:scale(.95)}
.pc i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,hsl(var(--h) 75% 62%));box-shadow:0 0 0 1px rgba(128,128,128,.4)}
.pc span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.pc.on{background:linear-gradient(135deg,rgba(143,123,255,.9),rgba(108,141,255,.9));border-color:transparent;color:#fff;box-shadow:0 5px 14px rgba(143,123,255,.35)}
.pc.on i{background:#fff}
.pc.fine.on{background:linear-gradient(135deg,#ff7d93,#ff9f6e);box-shadow:0 5px 14px rgba(255,125,147,.35)}
.selrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px;font-size:13px}
.gt:not(.flat) .cv{font-size:38px}
.ggrid[style*="--cols:2"] .gt:not(.flat) .cv{font-size:60px}
.ggrid[style*="--cols:4"] .gt:not(.flat) .cv{font-size:28px}
.ggrid.flat[style*="--cols:2"] .gt.flat .cv{height:56px;gap:8px}
.ggrid.flat[style*="--cols:2"] .gt.flat .em{font-size:24px}
.ggrid.flat[style*="--cols:2"] .gt.flat .gn{font-size:16px}
[data-theme=liquid] .pc.on{box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 5px 14px rgba(107,92,255,.3)}
[data-theme=brutal] .pc{border:2.5px solid #111;border-radius:8px;background:#fff;font-weight:700;box-shadow:3px 3px 0 #111}
[data-theme=brutal] .pc.on{background:var(--a1);box-shadow:3px 3px 0 #111}
[data-theme=brutal] .pc.fine.on{background:var(--fine)}
[data-theme=brutal] .pc i{border:1.5px solid #111;width:9px;height:9px}
[data-theme=brutal] .pc:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
[data-theme=material] .pc{border-radius:8px;background:none;border:1px solid #79747e;color:#49454f}
[data-theme=material] .pc.on{background:#e8def8;color:#1d192b;border-color:#e8def8;box-shadow:none}
[data-theme=material] .pc.fine.on{background:#ffd8e4;color:#31111d;border-color:#ffd8e4}
[data-theme=material] .pc.on i{background:hsl(var(--h) 60% 50%)}
[data-theme=typo] .pc{background:none;border:1.5px solid #141414;font-weight:700}
[data-theme=typo] .pc.on{background:#141414;color:#f6f4ef;box-shadow:none}
[data-theme=typo] .pc.fine.on{background:#e0301e;border-color:#e0301e}
[data-theme=typo] .pc i{background:#141414}
[data-theme=typo] .pc.on i{background:#f6f4ef}
.vt{margin-left:auto;display:flex;gap:6px}
.vbtn{height:30px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:700;background:var(--soft2);border:1px solid var(--line);white-space:nowrap}
.gt.flat .cv{aspect-ratio:auto;height:52px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 3px;font-size:inherit}
.gt.flat .em{font-size:clamp(15px,4.6vw,20px);flex:none}
.ej{display:block;flex:none;line-height:1}
img.ej{width:.86em;height:.86em;object-fit:contain;position:static;max-width:none;pointer-events:none}
.gt.flat .em{display:flex;align-items:center;line-height:1}
.gt .nm{text-align:center;font-size:13px;letter-spacing:-.01em}
.ggrid[style*="--cols:2"] .gt .nm{font-size:17px;padding:22px 10px 10px}
.ggrid[style*="--cols:4"] .gt .nm{font-size:11px;padding:14px 4px 6px}
.gt.flat .gn{font-size:clamp(12px,3.5vw,15px);font-weight:700;color:#fff;line-height:1.15;text-align:left;word-break:keep-all;letter-spacing:-.02em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ggrid.flat[style*="--cols:4"] .gt.flat .cv{flex-direction:column;gap:3px;height:60px;padding:4px}
.ggrid.flat[style*="--cols:4"] .gt.flat .em{font-size:18px}
.ggrid.flat[style*="--cols:4"] .gt.flat .gn{font-size:12px;text-align:center;-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
[data-theme=material] .gt.flat .gn,[data-theme=brutal] .gt.flat .gn,[data-theme=typo] .gt.flat .gn{color:var(--text);text-shadow:none}
[data-theme=brutal] .vbtn{border:2px solid #111;background:#fff;border-radius:8px}
[data-theme=typo] .vbtn{border:1.5px solid #141414;background:none}
[data-theme=material] .vbtn{border:1px solid #79747e;background:none;border-radius:8px;color:#49454f}
.gt{position:relative;border-radius:16px;overflow:hidden;border:2px solid transparent;transition:transform .12s, opacity .2s;text-align:left}
.gt:active{transform:scale(.96)}
.gt.on{border-color:#fff;box-shadow:0 0 0 3px rgba(143,123,255,.6)}
.gt.no{opacity:.35}
.gt .cv{aspect-ratio:1/1;font-size:30px}
.gt .nm{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;font-size:12px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.cv{--h:250;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 45%),linear-gradient(135deg,hsl(var(--h) 72% 58%),hsl(calc(var(--h) + 45) 68% 36%));overflow:hidden}
.cv img:not(.ej){position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop{width:220px;height:220px;margin:0 auto;border-radius:28px;font-size:90px;touch-action:none;cursor:grab;box-shadow:0 0 0 2px rgba(255,255,255,.5),0 14px 34px rgba(0,0,0,.35)}
.crop:active{cursor:grabbing}
.zoom{display:flex;align-items:center;gap:10px;margin:14px 4px 4px;color:var(--sub);font-size:13px}
.zoom input{flex:1;accent-color:var(--a1)}
.hint{font-size:12px;color:var(--dim);text-align:center;margin:10px 0 0;line-height:1.5}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow .inp{height:42px;font-size:14px}
.linkrow .btn{height:42px}
.fines .row{display:flex;align-items:center;gap:10px;padding:10px 0}
.fines .row+.row{border-top:1px solid var(--soft)}
.fines .row .nm{flex:1;font-weight:500}
.stepper{display:flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:11px;font-size:18px;font-weight:700;background:var(--soft)}
.stepper span{min-width:70px;text-align:center;font-weight:700;font-size:15px}
.quick{display:flex;gap:6px;margin-top:4px}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);width:calc(100% - 32px);max-width:488px;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 40px rgba(0,0,0,.4)}
.savebar .info{flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebar .info b{color:var(--text);font-size:15px;display:block}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;border-radius:15px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
.search svg{width:18px;height:18px;opacity:.6}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap}
.gcard{display:flex;gap:14px;padding:12px;text-align:left;width:100%;margin-bottom:12px}
.gcard .cv{flex:none;width:86px;height:86px;border-radius:16px;font-size:36px}
.gcard .mid{flex:1;min-width:0}
.gcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gcard .t b{font-size:16px}
.star{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.meta span{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--sub)}
.gcard p{margin:0;font-size:13px;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:5;height:50px;padding:0 18px;border-radius:18px;font-weight:700;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--a1),#6c8dff);box-shadow:0 10px 26px rgba(120,110,255,.45)}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.tool .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,rgba(143,123,255,.5),rgba(69,214,196,.35))}
.tool b{display:block;font-size:16px}
.tool small{color:var(--sub);font-size:13px}
.tool.soon{opacity:.55}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;display:flex;gap:4px;padding:6px;border-radius:24px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 14px 40px rgba(0,0,0,.45);width:calc(100% - 32px);max-width:488px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:18px;color:var(--dim);font-size:11px;font-weight:500;transition:background .2s,color .2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:#fff;background:var(--soft2)}
nav.tabs button.on svg{filter:drop-shadow(0 0 8px rgba(143,123,255,.8))}
.sheetwrap{position:fixed;inset:0;z-index:20;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.sheetwrap.show{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;border-radius:28px 28px 0 0;background:var(--panel);border:1px solid var(--line);border-bottom:0;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:900}
.sheet .lead{color:var(--sub);font-size:13px;margin:0 0 16px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.inp{width:100%;height:46px;padding:0 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);outline:0;font-size:15px}
.inp:focus{border-color:rgba(143,123,255,.7)}
textarea.inp{height:80px;padding:12px 14px;resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0 20px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
.pin-dots i.f{background:#fff;border-color:#fff}
.pin-dots.err{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:18px;background:var(--soft);font-size:22px;font-weight:500}
.pad button:active{background:var(--soft2)}
.bigcv{width:200px;height:200px;border-radius:30px;font-size:90px;margin:4px auto 18px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.mrow .inp{height:40px}
.mrow .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,125,147,.12);color:var(--pinkt);flex:none}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:20px 0 8px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);opacity:0;z-index:40;padding:12px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(20px);font-size:14px;font-weight:500;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.timer{text-align:center;font-size:58px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:22px 0 6px}
.timer small{font-size:28px;color:var(--sub)}
.timer.end{color:var(--fine);animation:shake .4s 2}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{flex:1;height:38px;border-radius:11px;font-weight:700;color:var(--sub);font-size:14px}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}
.laps{max-height:180px;overflow:auto;margin-top:14px}
.laps div{display:flex;justify-content:space-between;padding:8px 4px;border-top:1px solid var(--soft);font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.sk-p{background:var(--soft);border:1px solid var(--soft);border-radius:18px;padding:12px;margin-bottom:10px}
.sk-p .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sk-p .hd b{flex:1}
.sk-p .sc{font-weight:900;font-size:16px}
.sk-p .rs{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.rs.p{background:rgba(69,214,196,.16);color:var(--tealt)}.rs.m{background:rgba(255,125,147,.16);color:var(--pinkt)}
.sk-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sk-g label{font-size:11px;color:var(--sub);display:block;margin-bottom:4px;text-align:center}
.mstep{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:3px}
.mstep button{width:30px;height:30px;border-radius:9px;background:var(--soft);font-weight:700}
.mstep span{font-weight:700;font-variant-numeric:tabular-nums}
.rounds{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}
.rounds button{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--soft);font-weight:700;color:var(--sub)}
.rounds button.on{background:linear-gradient(135deg,var(--a1),#6c8dff);color:#fff}
.rounds button.done{color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:8px 4px;text-align:center;border-top:1px solid var(--soft)}
.tbl th{color:var(--sub);font-weight:500}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.empty{text-align:center;color:var(--dim);padding:22px 0;font-size:14px}
.upl{display:flex;align-items:center;gap:12px}
.upl .cv{width:72px;height:72px;border-radius:16px;font-size:30px;flex:none}
.upl input{display:none}

/* 공통 보정 */
.av{color:#fff}
.gt .nm{color:#fff}
.chip.on,.btn.pri,.fab{color:#fff}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.themes{row-gap:14px}
.th{text-align:center;font-size:12px;font-weight:700}
.th .pv{position:relative;height:96px;border-radius:16px;overflow:hidden;margin-bottom:7px;border:2px solid transparent;display:flex;align-items:flex-end;padding:8px}
.th.on .pv{border-color:var(--a1);box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 35%,transparent)}

.th.on .ck{display:grid}
.pv.glass{background:radial-gradient(circle at 20% 20%,#6a4cff,transparent 60%),radial-gradient(circle at 90% 80%,#18b3a2,transparent 55%),#0a0d1c}
.pv.glass i{border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.pv.liquid{background:radial-gradient(circle at 15% 25%,#a78bfa,transparent 55%),radial-gradient(circle at 85% 70%,#5eead4,transparent 55%),radial-gradient(circle at 60% 10%,#fda4af,transparent 50%),#eef1f8}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GFORMS=['개인전','팀전','협력'];

function gchips(g){const f=g.format?`<span class="fm">${esc(g.format)}</span>`:'';const t=(g.tags||[]).filter(x=>GTAGS.includes(x)).map(x=>`<span>${esc(x)}</span>`).join('');return f+t}

/* ---------- 저장 (지금은 이 기기 안에만, 나중에 파이어베이스로 교체) ---------- */
const ANIMALS=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐤','🦉','🦄','🐴','🐝','🐢','🐙','🐬','🐳','🦒','🦔','🐘','🦋'];
const PALETTE=[0,25,45,70,110,150,175,200,225,255,285,320].map(h=>({h})).concat([{c:'#f7f7f7'},{c:'#1c1c1e'},{c:'#8b5a2b'},{c:'#8e8e93'},{c:'#1e3a8a'},{c:'#ffb59a'}]);
const KEY='bgclub-v1';
let S;
/* 태그 정리: 이름으로 알 수 있는 게임은 형식·장르를 채우고, 목록에 없는 옛 태그는 지움 */
function tagFix(){const CL=['달무티','렉시오','뱀파이어퀸','티츄'];
  S.games.forEach(g=>{const k=(g.name||'').replace(/\s/g,''),c=GCLASS[k],cur=g.tags||[];
    if(c){if(!g.format)g.format=c[0];
      if(!cur.length||(CL.includes(k)&&cur.length===1&&cur[0]==='카드'))g.tags=[...c[1]]}
    g.tags=(g.tags||[]).filter(t=>GTAGS.includes(t)).slice(0,2);g.theme=''})}
function load(){try{const t=localStorage.getItem(KEY);if(t){S=JSON.parse(t);
  if(!S.extraV1){S.extraV1=true;const has=new Set(S.games.map(g=>g.name.replace(/\s/g,'')));EXTRA_GAMES.forEach(g=>{if(!has.has(g[0].replace(/\s/g,'')))S.games.push({id:uid(),name:g[0],emoji:g[1],min:g[2],max:g[3],theme:g[4],rating:g[5],desc:g[6],hue:g[7],img:''})});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(!S.tagV1){S.tagV1=true;S.games.forEach(classify);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(!S.tagV2){S.tagV2=true;S.games.forEach(g=>{if(g.tags)g.tags=g.tags.map(t=>t==='말·단어'?'단어·소통':t==='퍼즐·배치'?'타일·배치':t)});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(!S.tagV3){S.tagV3=true;tagFix();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  return}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('이 기기에 저장 공간이 부족해요')}cloudPush()}

/* ---------- 클라우드(파이어베이스) 공유 ----------
   FIREBASE_CONFIG 가 null 이면 지금처럼 이 기기 안에만 저장돼요.
   회원·게임·기록·비밀번호는 클라우드로 모든 기기가 같이 쓰고, 점수판(스컬킹·티츄·스파이폴)과 테마는 기기마다 따로 둬요. */
const FIREBASE_CONFIG=null;
const FB_VER='10.14.1';
const CCOLS=['members','games','records'];
const CLD={cfg:FIREBASE_CONFIG,st:FIREBASE_CONFIG?'connecting':'off',msg:'',db:null,f:null,sh:{members:new Map(),games:new Map(),records:new Map(),set:''},got:{},attached:false,t:0};
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,c)=>(a[c]=x[c],a),{}):x);
const clean=o=>JSON.parse(JSON.stringify(o));
const cloudSet=()=>({pin:S.pin,avMode:S.avMode||'emoji'});
function cloudMsg(e){const c=(e&&(e.code||''))+'';
  if(/operation-not-allowed|admin-restricted/.test(c))return '익명 로그인이 꺼져 있어요. 파이어베이스 Authentication에서 "익명"을 사용 설정해 주세요.';
  if(/unauthorized-domain/.test(c))return '이 주소가 승인된 도메인에 없어요. Authentication 설정의 승인된 도메인에 추가해 주세요.';
  if(/permission-denied/.test(c))return '규칙이 막고 있어요. Firestore 규칙을 다시 확인해 주세요.';
  if(/network|unavailable/.test(c))return '인터넷 연결을 확인해 주세요.';
  return c||(e&&e.message)||'알 수 없는 문제';}
function cloudErr(e,write){console.error('[cloud]',e);const m=cloudMsg(e);
  if(write){toast('클라우드에 저장하지 못했어요. '+m,3600);return}
  if(CLD.st!=='on'){CLD.st='error';CLD.msg=m;cloudStatusUpd();toast('클라우드에 연결하지 못했어요. 이 기기에만 저장 중이에요 (설정에서 확인)',3600)}}
async function cloudInit(){
  if(!CLD.cfg)return;
  try{
    const V='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const [a,au,fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=a.initializeApp(CLD.cfg);
    await au.signInAnonymously(au.getAuth(app));
    CLD.f=fs;CLD.db=fs.getFirestore(app);
    fs.onSnapshot(fs.doc(CLD.db,'meta','init'),snap=>{
      if(snap.exists()){if(!CLD.attached)cloudAttach()}
      else if(!CLD.attached){CLD.st='empty';cloudStatusUpd()}
    },cloudErr);
  }catch(e){cloudErr(e)}
}
function cloudAttach(){
  CLD.attached=true;CLD.st='syncing';cloudStatusUpd();
  const f=CLD.f;
  CCOLS.forEach(col=>f.onSnapshot(f.collection(CLD.db,col),snap=>cloudApply(col,snap),cloudErr));
  f.onSnapshot(f.doc(CLD.db,'settings','main'),cloudApplySet,cloudErr);
}
function cloudApply(col,snap){
  const arr=[],sh=new Map();
  snap.forEach(d=>{const o={...d.data(),id:d.id};arr.push(o);sh.set(d.id,canon(o))});
  arr.sort((a,b)=>(a._o||0)-(b._o||0)||(a.id<b.id?-1:1));
  CLD.sh[col]=sh;CLD.got[col]=true;
  /* 아직 클라우드에 올라가지 않은 이 기기의 새 항목(연결 전·오프라인에서 만든 것)은 지우지 않고 지켜요 */
  const kn=knownSet();let kch=false;
  arr.forEach(o=>{if(!kn.has(o.id)){kn.add(o.id);kch=true}});
  const pend=S[col].filter(o=>!sh.has(o.id)&&!kn.has(o.id));
  if(kch)knownSave(kn);
  const nw=pend.length?arr.concat(pend):arr;
  const ch=canon(S[col])!==canon(nw);if(ch)S[col]=nw;
  cloudAfter(ch);
}
const KNOWN_KEY='bgclub-known';
function knownSet(){if(CLD._kn)return CLD._kn;let a=null;try{a=JSON.parse(localStorage.getItem(KNOWN_KEY))}catch(e){}
  if(!Array.isArray(a)){a=[];CCOLS.forEach(c=>(S[c]||[]).forEach(o=>a.push(o.id)));if(CLD._kn0)a=[...CLD._kn0]}
  return CLD._kn=new Set(a)}
function knownSave(k){try{localStorage.setItem(KNOWN_KEY,JSON.stringify([...k]))}catch(e){}}
function cloudApplySet(snap){
  const d=snap.exists()?snap.data():{};let ch=false;
  if(d.pin&&d.pin!==S.pin){S.pin=d.pin;ch=true}
  if(d.avMode&&d.avMode!==S.avMode){S.avMode=d.avMode;ch=true}
  CLD.sh.set=canon(cloudSet());CLD.got.set=true;cloudAfter(ch);
}
function cloudAfter(ch){
  if(CCOLS.every(c=>CLD.got[c])&&CLD.got.set&&CLD.st!=='on'){CLD.st='on';cloudStatusUpd();doPush()}
  if(!ch)return;
  D.players=D.players.filter(id=>S.members.some(m=>m.id===id));
  Object.keys(D.fines).forEach(id=>{if(!S.members.some(m=>m.id===id))delete D.fines[id]});
  if(D.gameId&&!S.games.some(g=>g.id===D.gameId))D.gameId=null;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  cloudRender();
}
function cloudRender(){
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&$('#view').contains(a))return;
  const y=scrollY;render();scrollTo(0,y);
}
function cloudPush(){if(CLD.st==='on')doPush()}
/* 바뀐 것만 곧바로 보내요(보낸 즉시 이 기기 화면에도 반영되므로, 서버의 옛 상태가 도착해도 되돌려지지 않아요) */
async function doPush(){
  if(CLD.st!=='on')return;
  const f=CLD.f,ops=[];
  CCOLS.forEach(col=>{const cur=new Map(),sh=CLD.sh[col];
    S[col].forEach((o,i)=>{if(!o._o)o._o=Date.now()+i;cur.set(o.id,canon(o))});
    cur.forEach((js,id)=>{if(sh.get(id)!==js){ops.push(['set',col,id,clean(S[col].find(x=>x.id===id))]);sh.set(id,js)}});

function fitPos(p){p=Object.assign({a:1,z:1},p||{});const W=(p.a>=1?p.a*100:100)*p.z,H=(p.a>=1?100:100/p.a)*p.z;

const EMO={};
function emoURL(e){
  if(e in EMO)return EMO[e];
  let url='';
  try{
    const S=96,W=192,cv=document.createElement('canvas');cv.width=cv.height=W;
    const c=cv.getContext('2d',{willReadFrequently:true});
    c.font=`${S}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Samsung Color Emoji",sans-serif`;
    c.textAlign='center';c.textBaseline='middle';c.fillText(e,W/2,W/2);
    const d=c.getImageData(0,0,W,W).data;let x0=W,x1=-1,y0=W,y1=-1;
    for(let y=0;y<W;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1>=0){
      const w=x1-x0+1,h=y1-y0+1,side=Math.max(w,h)+4,o=document.createElement('canvas');o.width=o.height=side;
      o.getContext('2d').drawImage(cv,x0,y0,w,h,(side-w)/2,(side-h)/2,w,h);url=o.toDataURL('image/png');
    }
  }catch(err){}
  return EMO[e]=url;
}

${names.map((n,i)=>(i+1)+'. '+n).join('\n')}`;

/* ---- 인원 범위 막대 / 이모지 선택 ---- */
let pnA=2,pnB=5,pnRs=null;
const pnX=v=>(v-1)/9*100;
function pnHTML(){return `<div class="rsl pnrs" id="prsl" onpointerdown="pnDown(event)" onpointermove="pnMove(event)" onpointerup="pnUp(event)" onpointercancel="pnUp(event)"><div class="rin" id="prin"><div class="rtrack"></div><div class="rfill" id="pfill"></div>${Array.from({length:10},(_,i)=>`<i class="tk" style="left:${pnX(i+1)}%"></i><em class="tl" style="left:${pnX(i+1)}%">${i+1}</em>`).join('')}<div class="rth" id="pt0"></div><div class="rth" id="pt1"></div></div></div>`}
function pnUpd(){const f=$('#pfill');if(!f)return;f.style.left=pnX(pnA)+'%';f.style.width=(pnX(pnB)-pnX(pnA))+'%';const a=$('#pt0'),b=$('#pt1');a.style.left=pnX(pnA)+'%';a.textContent=pnA;b.style.left=pnX(pnB)+'%';b.textContent=pnB;const n=$('#pnv');if(n)n.textContent=pnA===pnB?pnA+'명':pnA+'~'+pnB+'명';document.querySelectorAll('#prin .tl').forEach((e,i)=>e.classList.toggle('in',i+1>=pnA&&i+1<=pnB))}
function pnVal(e){const r=$('#prin').getBoundingClientRect();return Math.max(1,Math.min(10,Math.round((e.clientX-r.left)/r.width*9)+1))}
function pnDown(e){const v=pnVal(e),t=e.target.id||'';let w;if(t==='pt0')w=0;else if(t==='pt1')w=1;else{const d0=Math.abs(v-pnA),d1=Math.abs(v-pnB);w=d0<d1?0:d0>d1?1:(v<pnA?0:1)}pnRs={w,amb:pnA===pnB&&t.startsWith('pt')};e.currentTarget.setPointerCapture(e.pointerId);pnMove(e)}
function pnMove(e){if(!pnRs)return;const v=pnVal(e);if(pnRs.amb){if(v===pnA)return;pnRs.w=v<pnA?0:1;pnRs.amb=false}if(pnRs.w===0)pnA=Math.min(v,pnB);else pnB=Math.max(v,pnA);pnUpd()}

function cropFail(){if(!FI.img)return;FI.img='';FI.pos=null;drawCrop();toast('사진을 불러오지 못해서 이모지 표지로 돌아갔어요')}
function bindCrop(){
  const el=$('#crop');if(!el||!FI.img)return;
  el.ondragstart=el.oncontextmenu=e=>e.preventDefault();
  const ptr=new Map();let g=null;
  const begin=()=>{const p=fitPos(FI.pos),pts=[...ptr.values()];
    if(pts.length===1)g={t:'d',x:pts[0].x,y:pts[0].y,ox:p.ox,oy:p.oy};
    else if(pts.length>=2)g={t:'p',d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,z:p.z};
    else g=null};
  el.onpointerdown=e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});begin()};
  el.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!g)return;const r=el.getBoundingClientRect(),pts=[...ptr.values()];
    if(g.t==='d'&&pts.length===1){FI.pos=fitPos({...FI.pos,ox:g.ox+(e.clientX-g.x)/r.width*100,oy:g.oy+(e.clientY-g.y)/r.width*100});placeCrop()}
    else if(g.t==='p'&&pts.length>=2){const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);zoomAt(g.z*d/g.d,((pts[0].x+pts[1].x)/2-r.left)/r.width*100,((pts[0].y+pts[1].y)/2-r.top)/r.height*100)}};
  el.onpointerup=el.onpointercancel=e=>{ptr.delete(e.pointerId);begin()};
  el.onwheel=e=>{e.preventDefault();const r=el.getBoundingClientRect(),p=fitPos(FI.pos);zoomAt(p.z*(e.deltaY<0?1.08:1/1.08),(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)};
}
function placeCrop(){const i=$('#crop img:not(.ej)');if(!i)return;const p=fitPos(FI.pos);Object.assign(i.style,{width:p.W+'%',height:p.H+'%',left:p.ox+'%',top:p.oy+'%'})}
function zoomAt(z,fx,fy){z=Math.max(1,Math.min(4,z));const p=fitPos(FI.pos),W2=p.W/p.z*z,H2=p.H/p.z*z,u=(fx-p.ox)/p.W,v=(fy-p.oy)/p.H;
  FI.pos=fitPos({...p,z,ox:fx-u*W2,oy:fy-v*H2});placeCrop();const r=$('#czr');if(r)r.value=z}
function zoomCrop(z){zoomAt(z,50,50)}
function zoomStep(d){zoomAt(fitPos(FI.pos).z+d,50,50)}
function setImg(src,w,h){FI.img=src;FI.pos=fitPos({a:w/h,z:1});drawCrop()}
function loadBlob(f){
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const k=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);setImg(c.toDataURL('image/jpeg',.78),c.width,c.height);URL.revokeObjectURL(url);toast('사진을 넣었어요. 위치를 맞춰 보세요')};
  img.onerror=()=>toast('이 파일은 사진으로 열 수 없어요');
  img.src=url;
}
function pasteImg(e){
  const items=[...(e.clipboardData||{}).items||[]],it=items.find(x=>x.type.startsWith('image/'));
  if(it){e.preventDefault();loadBlob(it.getAsFile());return}
  setTimeout(applyLink,0);
}
function applyLink(){
  const v=$('#flink').value.trim();if(!v)return;
  if(!/^https?:\/\//i.test(v)&&!v.startsWith('data:image')){toast('http로 시작하는 사진 링크를 넣어 주세요');return}
  const img=new Image();
  img.onload=()=>{setImg(v,img.naturalWidth,img.naturalHeight);$('#flink').value='';const r=$('#linkrow');if(r)r.style.display='none';toast('사진을 넣었어요. 위치를 맞춰 보세요')};
  img.onerror=()=>toast('사진 주소가 아니거나 막힌 주소예요. 사진을 복사해서 이 칸에 붙여넣거나 파일로 올려 보세요');
  img.referrerPolicy='no-referrer';img.src=v;
}
function saveGame(id,hue){

/* 스톱워치·타이머 */
const T={mode:'sw',acc:0,st:0,run:false,laps:[],dur:60000,left:60000,end:0,trun:false,done:false};
let raf=0,actx=null;
function openTimer(){openSheet('<button class="fsx" aria-label="닫기" onclick="closeSheet()">✕</button><div id="tm"></div>',()=>{cancelAnimationFrame(raf)});$('#sheet').classList.add('full');drawTimer();loop()}
const fmtT=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,cs=Math.floor(ms/10)%100;return `${pad2(m)}:${pad2(s)}<small>.${pad2(cs)}</small>`};
const swNow=()=>T.acc+(T.run?Date.now()-T.st:0);
const tmLeft=()=>T.trun?T.end-Date.now():T.left;
function drawTimer(){
  const el=$('#tm');if(!el)return;
  el.innerHTML=`<div class="seg"><button class="${T.mode==='sw'?'on':''}" onclick="T.mode='sw';drawTimer()">스톱워치</button><button class="${T.mode==='tm'?'on':''}" onclick="T.mode='tm';drawTimer()">타이머</button></div>`+
  (T.mode==='sw'?`<div class="timer" id="tt">${fmtT(swNow())}</div>
    <div class="btns"><button class="btn" onclick="swLap()">${T.run?'구간':'초기화'}</button><button class="btn pri" onclick="swToggle()">${T.run?'멈춤':'시작'}</button></div>
    <div class="laps">${T.laps.map((l,i)=>`<div><span>구간 ${T.laps.length-i}</span><span>${fmtT(l).replace(/<\/?small>/g,'')}</span></div>`).join('')}</div>`
  :`<div class="timer ${T.done?'end':''}" id="tt">${fmtT(tmLeft())}</div>
    <div class="chips" style="justify-content:center">${[[30,'30초'],[60,'1분'],[120,'2분'],[180,'3분'],[300,'5분']].map(([s,l])=>`<button class="chip plain ${T.dur===s*1000?'on':''}" onclick="setDur(${s})">${l}</button>`).join('')}</div>
    <div class="btns"><button class="btn" onclick="setDur(T.dur/1000)">초기화</button><button class="btn pri" onclick="tmToggle()">${T.trun?'멈춤':'시작'}</button></div>`);
}
function loop(){const el=$('#tt');if(!el)return;
  if(T.mode==='sw')el.innerHTML=fmtT(swNow());
  else{el.innerHTML=fmtT(tmLeft());if(T.trun&&tmLeft()<=0){T.trun=false;T.left=0;T.done=true;beep();drawTimer()}}
  raf=requestAnimationFrame(loop)}
function swToggle(){if(T.run){T.acc+=Date.now()-T.st;T.run=false}else{T.st=Date.now();T.run=true}drawTimer()}
function swLap(){if(T.run)T.laps.unshift(swNow());else{T.acc=0;T.laps=[]}drawTimer()}
function setDur(s){T.dur=s*1000;T.left=T.dur;T.trun=false;T.done=false;drawTimer()}
function tmToggle(){initAudio();if(T.trun){T.left=T.end-Date.now();T.trun=false}else{if(T.left<=0)T.left=T.dur;T.end=Date.now()+T.left;T.trun=true;T.done=false}drawTimer()}
function initAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}try{if(!actx)return;[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}}

function openSF(){openSheet('<div id="sf"></div>');drawSF()}
function sfCalc(pl,spy,out,acc){const o={};pl.forEach(p=>o[p]=0);if(!spy||!out)return o;
  if(out==='caught')pl.forEach(p=>{if(p!==spy)o[p]=p===acc?2:1});
  else if(out==='miss')pl.forEach(p=>{if(p!==spy)o[p]=1});
  else o[spy]=out==='time'?2:4;
  return o}
function sfTotals(){const t={};S.sf.players.forEach(p=>t[p]=0);S.sf.rounds.forEach(r=>S.sf.players.forEach(p=>t[p]+=r.pts[p]||0));return t}
const sfFmt=v=>v>0?'+'+v:'0';
function sfOk(){const c=SFI;return !!(c.spy&&c.out&&(c.out!=='caught'||(c.acc&&c.acc!==c.spy)))}
function drawSF(){
  const el=$('#sf');if(!el)return;const keep=$('#sheet').scrollTop;
  $('#sheet').classList.toggle('tall',!!S.sf);
  if(!S.sf){
    el.innerHTML=`<div class="tchd"><h2>스파이폴 점수판</h2><span class="sp"></span><button class="fsx" aria-label="닫기" onclick="closeSheet()">✕</button></div><p class="lead">3–8명이 함께해요. 라운드마다 결과만 고르면 점수가 계산돼요</p>
    <div class="sec" style="margin-top:4px">함께하는 사람 (3–8명)</div>${activeMembers().length?'':'<div class="empty">회원이 없어요. ⚙ 설정에서 회원을 먼저 추가해 주세요</div>'}
    <div class="chips">${activeMembers().map(m=>`<button class="chip ${sfSel.includes(m.id)?'on':''}" onclick="sfPick('${m.id}')">${av(m,1)}${esc(m.name)}</button>`).join('')}</div>
    <div class="banner" style="margin:12px 0 0;background:rgba(143,123,255,.1);border-color:rgba(143,123,255,.3)">🕵️ <div><b>점수 규칙</b><br>스파이 적발 실패 +2 · 엉뚱한 지목·장소 적중 +4<br>스파이를 잡으면 비스파이 +1, 고발한 사람 +2</div></div>
    <div class="btns"><button class="btn pri" ${sfSel.length>=3&&sfSel.length<=8?'':'disabled'} onclick="sfStart()">${sfSel.length?sfSel.length+'명으로 ':''}시작</button></div>`;$('#sheet').scrollTop=keep;return}
  const k=S.sf,pl=k.players,tot=sfTotals(),top=Math.max(...pl.map(p=>tot[p])),n=k.rounds.length+1;
  const spied=Object.fromEntries(pl.map(p=>[p,k.rounds.filter(r=>r.spy===p).length]));
  if(SFI.spy&&!pl.includes(SFI.spy))SFI.spy=null;
  const pv=sfCalc(pl,SFI.spy,SFI.out,SFI.acc),ok=sfOk();
  const rows=k.rounds.length?k.rounds.map((r,i)=>`<tr><td class="r">R${i+1}</td>${pl.map(p=>{const v=r.pts[p]||0,t=sfFmt(v);return `<td class="${v?'':'e'}">${p===r.spy?`<b class="ring">${t}</b>`:t}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${pl.length+1}" class="sfz">라운드를 저장하면 여기에 쌓여요 · 동그라미는 그 라운드의 스파이</td></tr>`;
  const allSpied=pl.every(p=>spied[p]>0)&&k.rounds.length>=pl.length;
  const leaders=pl.filter(p=>tot[p]===top);
  el.innerHTML=`<div class="tchd"><h2>스파이폴 점수판</h2><span class="sp"></span><button class="chip plain ic" aria-label="실행 취소" ${k.rounds.length?'':'disabled'} onclick="sfUndo()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button><button class="chip plain ic" aria-label="다시 실행" ${sfRedoSt.length?'':'disabled'} onclick="sfRedo()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button><button class="fsx" aria-label="닫기" onclick="closeSheet()">✕</button></div>
  <div class="card sktw"><table class="skt"><colgroup><col style="width:44px">${pl.map(()=>'<col>').join('')}</colgroup>
  <thead><tr><th></th>${pl.map(p=>`<th>${av(mem(p))}<span>${esc(mem(p).name)}</span></th>`).join('')}</tr></thead><tbody>${rows}
  <tr class="tot"><td class="r">합계</td>${pl.map(p=>`<td class="${tot[p]===top&&top>0?'top':''}">${tot[p]}</td>`).join('')}</tr></tbody></table></div>
  ${allSpied?`<div class="banner" style="margin:0 0 8px">🏁 <div>모두 한 번씩 스파이를 했어요. 지금 1등: <b>${leaders.map(p=>esc(mem(p).name)).join(', ')}</b> (${top}점)</div></div>`:''}
  <div class="skdock sfpanel">
    <div class="sfq">① 이번 라운드 스파이</div>
    <div class="chips">${pl.map(p=>`<button class="chip plain ${SFI.spy===p?'on':''}" onclick="sfSpy('${p}')">${esc(mem(p).name)}${spied[p]?`<small>🕵️${spied[p]}</small>`:''}</button>`).join('')}</div>
    <div class="sfq">② 라운드 결과</div>
    <div class="sfo"><div class="sfh" style="grid-area:1/1">🕵️ 스파이가 이겨요</div><div class="sfh" style="grid-area:1/2">👥 비스파이가 이겨요</div>${[['wrong',1,2],['loc',1,3],['time',1,4],['caught',2,2],['miss',2,3]].map(([id,c,r])=>{const o=SFO.find(x=>x[0]===id);return `<button class="chip plain ${SFI.out===id?'on':''}" style="grid-area:${r}/${c}" onclick="sfOut('${id}')"><b>${o[1]} ${o[2]}</b><small>${o[3]}</small></button>`}).join('')}</div>
    ${SFI.out==='caught'?`<div class="sfq">③ 고발한 사람 <span class="dim" style="font-weight:500">(스파이를 지목해 성공시킨 사람)</span></div>
    <div class="chips">${pl.filter(p=>p!==SFI.spy).map(p=>`<button class="chip plain ${SFI.acc===p?'on':''}" onclick="SFI.acc='${p}';drawSF()">${esc(mem(p).name)}</button>`).join('')}</div>`:''}
    <div class="sfprev">${ok?pl.filter(p=>pv[p]).map(p=>`${esc(mem(p).name)} <b>+${pv[p]}</b>`).join(' · '):'<span class="dim">스파이와 결과를 고르면 점수가 보여요</span>'}</div>
    <button class="btn pri full" ${ok?'':'disabled'} onclick="sfSave()">라운드 ${n} 저장</button>
  </div>
  <div class="btns"><button class="btn danger" onclick="confirmSheet('스파이폴 게임을 끝낼까요?','점수판이 초기화돼요.','끝내기',()=>{S.sf=null;sfRedoSt=[];SFI={spy:null,out:null,acc:null};save();openSF()},openSF)">새 게임</button><button class="btn" ${k.rounds.length?'':'disabled'} onclick="sfToFine()">벌금 기록하기</button></div>`;
  $('#sheet').scrollTop=keep}
function sfPick(id){const i=sfSel.indexOf(id);if(i>=0)sfSel.splice(i,1);else if(sfSel.length<8)sfSel.push(id);else toast('스파이폴은 최대 8명이에요');drawSF()}
function sfStart(){S.sf={players:[...sfSel],rounds:[]};SFI={spy:null,out:null,acc:null};sfRedoSt=[];save();drawSF()}
function sfSpy(p){SFI.spy=SFI.spy===p?null:p;if(SFI.acc===p)SFI.acc=null;drawSF()}
function sfOut(o){SFI.out=SFI.out===o?null:o;if(SFI.out!=='caught')SFI.acc=null;drawSF()}
function sfSave(){if(!sfOk())return;const k=S.sf,c=SFI;sfRedoSt=[];k.rounds.push({spy:c.spy,out:c.out,acc:c.out==='caught'?c.acc:null,pts:sfCalc(k.players,c.spy,c.out,c.acc)});SFI={spy:null,out:null,acc:null};save();drawSF()}
function sfUndo(){if(!S.sf.rounds.length)return;sfRedoSt.push(S.sf.rounds.pop());save();drawSF()}
function sfRedo(){if(!sfRedoSt.length)return;S.sf.rounds.push(sfRedoSt.pop());save();drawSF()}
function sfToFine(){
  const k=S.sf,tot=sfTotals(),order=[...k.players].sort((a,b)=>tot[a]-tot[b]);
  const g=S.games.find(x=>x.name.replace(/\s/g,'').includes('스파이폴'));
  D={date:todayStr(),players:[...k.players],gameId:g?g.id:null,fines:{}};
  const low=lowestFine(k.players,tot);low.forEach(id=>D.fines[id]=1000);
  closeSheet();go('record');toast(fineToast(low,k.players));
}

let onClose=null;
function openSheet(html,cleanup){if(onClose){const f=onClose;onClose=null;f()}$('#sheet').classList.remove('full','tall');$('#sheet').style.transform='';$('#sheet').style.transition='';$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sw').classList.add('show');$('#sheet').scrollTop=0;onClose=cleanup||null}
function closeSheet(){$('#sw').classList.remove('show');if(onClose){const f=onClose;onClose=null;f()}}
(function(){let d=null;const sh=()=>document.getElementById('sheet');
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.sheet .grab');if(!g||getComputedStyle(g).display==='none')return;d={y:e.clientY,t:Date.now(),dy:0};sh().style.transition='none';try{g.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!d)return;d.dy=Math.max(0,e.clientY-d.y);sh().style.transform='translateY('+d.dy+'px)'});
const end=()=>{if(!d)return;const s=sh(),dy=d.dy,v=dy/Math.max(1,Date.now()-d.t);d=null;s.style.transition='transform .22s ease';if(dy>110||(dy>40&&v>.5)){s.style.transform='translateY(110%)';setTimeout(()=>{closeSheet();s.style.transform='';s.style.transition=''},210)}else{s.style.transform='';setTimeout(()=>{s.style.transition=''},230)}};
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end)})();
let unlocked=false,pinBuf='';
function requirePin(cb){
  if(unlocked){cb();return}
  pinBuf='';window._pinCb=cb;
  openSheet(`<h2 style="text-align:center">회장 비밀번호</h2><p class="lead" style="text-align:center">삭제·수정·회원 관리에 필요해요</p><div class="pin-dots" id="pd">${'<i></i>'.repeat(4)}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div>`);
}
function pinKey(k){
  if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  const pd=$('#pd');pd.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length));
  if(pinBuf.length===4){
    if(pinBuf===S.pin){unlocked=true;const cb=window._pinCb;window._pinCb=null;closeSheet();setTimeout(cb,60)}
    else{pd.classList.remove('err');void pd.offsetWidth;pd.classList.add('err');pinBuf='';setTimeout(()=>pd.querySelectorAll('i').forEach(d=>d.classList.remove('f')),250)}
  }
}
function confirmSheet(title,msg,ok,onOk,onCancel){
  window._cOk=onOk;window._cNo=onCancel;
  openSheet(`<h2>${esc(title)}</h2><p class="lead">${esc(msg)}</p><div class="btns"><button class="btn" onclick="(window._cNo||closeSheet)()">취소</button><button class="btn danger" onclick="window._cOk()">${esc(ok)}</button></div>`);
}

 ${S.avMode==='color'?'<button class="btn sm full" style="margin:6px 0 4px;height:36px" onclick="recolor()">🎨 색상 겹치지 않게 자동 정리</button>':''}
  <div class="mrow"><input class="inp" id="newm" placeholder="새 회원 이름" onkeydown="if(event.key==='Enter')addMember()"><button class="btn sm pri" style="height:40px" onclick="addMember()">추가</button></div>

/* 초기화: 데이터 초기화(게임은 남김) / 전체 초기화(게임까지). 비밀번호·화면 설정은 둘 다 남김 */
function resetBoards(){S.members=[];S.records=[];S.sk=null;S.tc=null;S.sf=null;
  D={date:todayStr(),players:[],gameId:null,fines:{}};skSel=[];skCell=null;tcA=[];tcB=[];TI={type:'card',a:50,calls:{}};tcRedoSt=[];sfSel=[];SFI={spy:null,out:null,acc:null};sfRedoSt=[];window._sb=false}
function askResetData(){const m=S.members.length,r=S.records.length;
  confirmSheet('데이터를 초기화할까요?',`회원 ${m}명과 벌금 기록 ${r}건, 진행 중인 점수판이 지워져요. 보유 게임 ${S.games.length}개는 그대로 남아요.${CLD.st==='on'?' 클라우드에서도 지워져 모든 기기에서 사라져요.':''} 되돌릴 수 없어요.`,'초기화',()=>{resetBoards();save();go('dash');closeSheet();toast('데이터를 초기화했어요. 게임 목록은 그대로예요')},openSettings)}
function askResetAll(){const m=S.members.length,r=S.records.length,g=S.games.length;
  confirmSheet('전체 초기화할까요?',`회원 ${m}명, 벌금 기록 ${r}건, 보유 게임 ${g}개가 모두 지워져요.${CLD.st==='on'?' 클라우드에서도 지워져 모든 기기에서 사라져요.':''}`,'계속',()=>
    confirmSheet('정말 전부 지울까요?','게임 목록까지 사라지고 되돌릴 수 없어요. 비밀번호와 화면 설정만 남아요.','전부 지우기',()=>{resetBoards();S.games=[];save();go('dash');closeSheet();toast('전체 초기화했어요')},openSettings),openSettings)}
function renameMember(id,v){v=v.trim();if(!v)return;mem(id).name=v;save();render();toast('이름을 바꿨어요')}
function setAvMode(m){S.avMode=m;save();render();openSettings()}
function pickAv(id){const m=mem(id),e=S.avMode==='emoji';
  openSheet(`<h2>${esc(m.name)} 님 ${e?'이모지':'색상'} 고르기</h2><div class="pick">${e?ANIMALS.map(a=>`<button class="pk ${m.emoji===a?'on':''}" onclick="setAv('${id}','e','${a}')">${emo(a)}</button>`).join(''):PALETTE.map((x,i)=>`<button class="pk sw ${(x.c?m.c===x.c:(!m.c&&m.hue===x.h))?'on':''}" style="--h:${x.h||0};${x.c?'--c:'+x.c:''}" onclick="setAv('${id}',${i})"></button>`).join('')}</div><div class="btns"><button class="btn" onclick="openSettings()">닫기</button></div>`)}
function setAv(id,k,v){const m=mem(id);if(k==='e')m.emoji=v;else{const x=PALETTE[k];if(x.c)m.c=x.c;else{m.hue=x.h;delete m.c}}save();render();openSettings()}
function bestHue(){const hs=activeMembers().map(m=>m.hue);if(!hs.length)return 250;let best=0,bd=-1;for(let h=0;h<360;h+=3){const d=Math.min(...hs.map(x=>{const a=Math.abs(h-x)%360;return Math.min(a,360-a)}));if(d>bd){bd=d;best=h}}return best}
function recolor(){const ms=activeMembers();ms.forEach((m,i)=>{m.hue=Math.round((i*360/ms.length+250)%360);delete m.c});save();render();openSettings();toast('색상을 겹치지 않게 다시 정리했어요')}
function addMember(){const v=$('#newm').value.trim();if(!v)return;S.members.push({id:uid(),name:v,hue:bestHue()});ensureAv();save();render();openSettings();toast(v+' 님을 추가했어요')}
function delMember(id){confirmSheet(`${mem(id).name} 님을 회원 목록에서 뺄까요?`,'지난 기록과 통계에는 그대로 남아요.','빼기',()=>{mem(id).hidden=true;D.players=D.players.filter(x=>x!==id);delete D.fines[id];save();render();openSettings()},openSettings)}
function changePin(){const v=$('#newpin').value;if(!/^\d{4}$/.test(v)){toast('숫자 4자리로 적어 주세요');return}S.pin=v;save();$('#newpin').value='';toast('비밀번호를 바꿨어요')}

render();
cloudInit();
</script>
</body>
</html>
